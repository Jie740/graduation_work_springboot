# ==================== 公共配置（所有环境共享） ====================
server:
  port: 8080
  tomcat:
    response-buffer-size: 0
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  # ==================== 默认激活的环境 ====================
  profiles:
    active: dev

  application:
    name: AgriculturalSystemApplication

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB


mybatis-plus:
  configuration:
    # 开启驼峰命名转换：下划线命名自动转驼峰命名
    map-underscore-to-camel-case: true

